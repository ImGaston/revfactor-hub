<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">PriceLabs listing name and listing ID</title>
  <desc id="desc">The Ashwood listing row with numbered callouts identifying the listing name on the second line and the channel and listing ID on the first line.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76574C"/>
    </marker>
  </defs>

  <rect width="900" height="230" rx="18" fill="#f5f7fa"/>
  <rect x="18" y="54" width="476" height="124" rx="9" fill="#ffffff" stroke="#d9dee7" filter="url(#shadow)"/>
  <image href="data:image/jpeg;base64," x="20" y="56" width="472" height="120"/>

  <rect x="82" y="124" width="143" height="18" rx="4" fill="#DDDAD3" fill-opacity="0.42" stroke="#76574C" stroke-width="2"/>
  <rect x="82" y="143" width="234" height="19" rx="4" fill="#DDDAD3" fill-opacity="0.42" stroke="#76574C" stroke-width="2"/>

  <path d="M 548 157 C 470 157, 410 153, 319 152" fill="none" stroke="#76574C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 548 89 C 470 89, 395 124, 228 133" fill="none" stroke="#76574C" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(540 130)">
    <rect width="332" height="54" rx="12" fill="#ffffff" stroke="#d9dee7" filter="url(#shadow)"/>
    <circle cx="28" cy="27" r="18" fill="#76574C"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="58" y="24" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#252b36">Listing Name</text>
    <text x="58" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#667085">The second line</text>
  </g>

  <g transform="translate(540 62)">
    <rect width="332" height="54" rx="12" fill="#ffffff" stroke="#d9dee7" filter="url(#shadow)"/>
    <circle cx="28" cy="27" r="18" fill="#76574C"/>
    <text x="28" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="58" y="24" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#252b36">Listing ID</text>
    <text x="58" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#667085">The first line: channel + ID</text>
  </g>
</svg>
