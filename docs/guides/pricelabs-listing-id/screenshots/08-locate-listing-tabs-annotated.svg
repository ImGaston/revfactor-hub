<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-labelledby="title desc">
  <title id="title">Check Unmapped Listings and Mapped Listings</title>
  <desc id="desc">The Manage Listings tabs with instructions to search Unmapped Listings first and Mapped Listings second.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76574C"/>
    </marker>
  </defs>

  <rect width="940" height="300" rx="18" fill="#f5f7fa"/>
  <text x="24" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#252b36">First, locate the tab that contains your listing</text>

  <rect x="243" y="58" width="454" height="54" rx="9" fill="#ffffff" stroke="#d9dee7" filter="url(#shadow)"/>
  <image href="data:image/jpeg;base64," x="245" y="60" width="450" height="50"/>
  <rect x="246" y="60" width="153" height="50" rx="4" fill="#DDDAD3" fill-opacity="0.28" stroke="#76574C" stroke-width="2"/>
  <rect x="400" y="60" width="139" height="50" rx="4" fill="#DDDAD3" fill-opacity="0.28" stroke="#76574C" stroke-width="2"/>

  <path d="M 245 161 C 260 140, 288 120, 322 112" fill="none" stroke="#76574C" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 695 161 C 640 135, 570 118, 471 112" fill="none" stroke="#76574C" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(45 158)">
    <rect width="400" height="72" rx="12" fill="#ffffff" stroke="#d9dee7" filter="url(#shadow)"/>
    <circle cx="32" cy="36" r="20" fill="#76574C"/>
    <text x="32" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">1</text>
    <text x="70" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#252b36">Search Unmapped Listings</text>
    <text x="70" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#667085">Check this tab first.</text>
  </g>

  <g transform="translate(495 158)">
    <rect width="400" height="72" rx="12" fill="#ffffff" stroke="#d9dee7" filter="url(#shadow)"/>
    <circle cx="32" cy="36" r="20" fill="#76574C"/>
    <text x="32" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">2</text>
    <text x="70" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#252b36">Then search Mapped Listings</text>
    <text x="70" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#667085">Use this tab if the listing was mapped previously.</text>
  </g>

  <text x="470" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#13342D">Search for the same property name in both tabs until you find it.</text>
</svg>
